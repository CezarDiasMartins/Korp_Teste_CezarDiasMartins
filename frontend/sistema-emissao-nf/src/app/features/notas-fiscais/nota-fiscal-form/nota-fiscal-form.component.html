<section class="page">
  <app-page-header title="Nova Nota Fiscal" subtitle="Status: Aberta">
    <button actions mat-flat-button color="primary" type="button" (click)="openItemDialog()">
      <mat-icon>add</mat-icon>
      Incluir item
    </button>
  </app-page-header>

  <app-loading [show]="loading"></app-loading>

  @if (!loading) {
    <div class="table-wrap">
      <table mat-table [dataSource]="itens">
        <ng-container matColumnDef="produto">
          <th mat-header-cell *matHeaderCellDef>Produto</th>
          <td mat-cell *matCellDef="let item">{{ item.produtoCodigo }} - {{ item.produtoDescricao }}</td>
        </ng-container>

        <ng-container matColumnDef="quantidade">
          <th mat-header-cell *matHeaderCellDef>Quantidade</th>
          <td mat-cell *matCellDef="let item">{{ item.quantidade }}</td>
        </ng-container>

        <ng-container matColumnDef="acao">
          <th mat-header-cell *matHeaderCellDef>Ação</th>
          <td mat-cell *matCellDef="let item">
            <button mat-icon-button type="button" (click)="remove(item)" aria-label="Remover item">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      @if (itens.length === 0) {
        <div class="empty">Nenhum item incluído.</div>
      }
    </div>

    <app-form-actions
      backLink="/notas-fiscais"
      backLabel="Cancelar"
      backIcon="close"
      (primaryClick)="save()">
    </app-form-actions>
  }
</section>

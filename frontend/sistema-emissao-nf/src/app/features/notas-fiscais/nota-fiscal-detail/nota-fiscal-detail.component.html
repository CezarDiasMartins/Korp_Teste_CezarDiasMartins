<section class="page">
  <app-page-header title="Visualizar Nota Fiscal" [subtitle]="nota ? 'Número ' + nota.numeroFormatado : ''">
    <a actions mat-stroked-button routerLink="/notas-fiscais">
      <mat-icon>arrow_back</mat-icon>
      Voltar
    </a>
  </app-page-header>

  <app-loading [show]="loading"></app-loading>

  @if (!loading && nota) {
    <div class="summary">
      <div>
        <span>Status</span>
        <strong>{{ nota.statusDescricao }}</strong>
      </div>
      <div>
        <span>Impressão</span>
        <strong>{{ nota.status === 'A' ? '-' : nota.statusImpressaoDescricao }}</strong>
      </div>
    </div>

    <div class="table-wrap">
      <table mat-table [dataSource]="nota.itens">
        <ng-container matColumnDef="produto">
          <th mat-header-cell *matHeaderCellDef>Produto</th>
          <td mat-cell *matCellDef="let item">{{ item.produtoCodigo }} - {{ item.produtoDescricao }}</td>
        </ng-container>

        <ng-container matColumnDef="quantidade">
          <th mat-header-cell *matHeaderCellDef>Quantidade</th>
          <td mat-cell *matCellDef="let item">{{ item.quantidade }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  }
</section>

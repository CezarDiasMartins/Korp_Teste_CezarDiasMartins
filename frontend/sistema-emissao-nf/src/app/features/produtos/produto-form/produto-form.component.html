<section class="page">
  <app-page-header [title]="title" subtitle="Campos com * são obrigatórios"></app-page-header>

  <app-loading [show]="loading"></app-loading>

  @if (!loading) {
    <form [formGroup]="form" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Código *</mat-label>
        <input matInput type="number" formControlName="codigo" />
        <mat-error>Informe um código válido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descrição *</mat-label>
        <input matInput formControlName="descricao" />
        <mat-error>Informe a descrição.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Saldo *</mat-label>
        <input matInput type="number" formControlName="saldo" />
        <mat-error>O saldo não pode ser negativo.</mat-error>
      </mat-form-field>

      <app-form-actions
        backLink="/produtos"
        [showPrimary]="!readonly"
        (primaryClick)="save()">
      </app-form-actions>
    </form>
  }
</section>

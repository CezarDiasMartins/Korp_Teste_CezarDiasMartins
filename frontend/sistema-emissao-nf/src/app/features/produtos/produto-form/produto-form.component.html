<section class="page">
  <header class="page-header">
    <div>
      <h1>{{ title }}</h1>
      <p>Campos com * sao obrigatorios</p>
    </div>
  </header>

  <app-loading [show]="loading"></app-loading>

  @if (!loading) {
    <form [formGroup]="form" class="form">
      <mat-form-field appearance="outline">
        <mat-label>Codigo *</mat-label>
        <input matInput type="number" formControlName="codigo" />
        <mat-error>Informe um codigo valido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Descricao *</mat-label>
        <input matInput formControlName="descricao" />
        <mat-error>Informe a descricao.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Saldo *</mat-label>
        <input matInput type="number" formControlName="saldo" />
        <mat-error>O saldo nao pode ser negativo.</mat-error>
      </mat-form-field>

      <div class="actions">
        <a mat-stroked-button routerLink="/produtos">
          <mat-icon>arrow_back</mat-icon>
          Voltar
        </a>
        @if (!readonly) {
          <button mat-flat-button color="primary" type="button" (click)="save()">
            <mat-icon>save</mat-icon>
            Salvar
          </button>
        }
      </div>
    </form>
  }
</section>
